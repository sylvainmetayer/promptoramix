# SonarQube Cloud : analyse lancée par le job « Couverture & SonarQube » du
# workflow Qualité, une fois la couverture produite. L'analyse automatique doit
# être désactivée sur SonarCloud, et le secret SONAR_TOKEN ajouté au dépôt.
sonar.organization=sylvainmetayer-github
sonar.projectKey=sylvainmetayer_promptoramix
sonar.projectName=promptoramix

sonar.sources=src
# Les tests unitaires sont inline (#[cfg(test)]) ; examples/ et duel/ sont des
# bancs d'essai, pas du code livré.
sonar.exclusions=examples/**,duel/**,target/**
sonar.sourceEncoding=UTF-8

sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy.json
