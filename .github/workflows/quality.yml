name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Couverture & SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarQube a besoin de l'historique pour attribuer les nouvelles lignes.
          fetch-depth: 0
          persist-credentials: false
      # Version et composants : rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-llvm-cov
      - name: Tests avec couverture
        run: cargo llvm-cov --release --locked --all-targets --lcov --output-path lcov.info
      - name: Rapport Clippy pour SonarQube
        run: cargo clippy --all-targets --locked --message-format=json > clippy.json || true
      - name: Analyse SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
