name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Relance manuelle quand GitHub n'a pas déclenché l'événement de la PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/promptoramix

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Version et composants : rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Chaque image poussée sur :main change de digest (étiquettes de date et de
      # révision) et Renovate la redéploie sur flip : un commit qui ne touche pas
      # l'image (mise à jour d'une action, README) ne doit pas redémarrer le bot.
      # Vague 3 : une telle mise à jour, fusionnée deux heures avant la vague, est
      # le suspect n° 1 d'une réponse illisible et d'un hors-délai.
      - id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- Dockerfile .dockerignore Cargo.toml Cargo.lock src; then
            echo "Image inchangée depuis $BEFORE : rien à publier."
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name == 'push' && steps.changes.outputs.image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
      # Construite et chargée localement, contrôlée, puis seulement poussée :
      # Renovate déploie le digest de :main sur flip dès qu'il change.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: promptoramix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Contrôle de l'image
        run: |
          docker run -d --rm --name bot -p 8080:8080 promptoramix:ci
          for _ in $(seq 30); do curl -fs 127.0.0.1:8080/health && break; sleep 1; done
          curl -fs -X POST 127.0.0.1:8080/ -d '{"protocol":1,"game":"ci","color":"blue","record":"","deadline_ms":2500}' | grep -q '"move"'
          docker stop bot
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: github.event_name == 'push' && steps.changes.outputs.image == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
